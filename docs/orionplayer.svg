<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111625"/>
      <stop offset="50%" stop-color="#0A0D15"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Orbital 'O' Crescent Gradient -->
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Play Prism Top Facet Gradient -->
    <linearGradient id="topFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Play Prism Bottom Facet Gradient -->
    <linearGradient id="bottomFacetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Center Spine Highlight -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow Filter for Ambient Core -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Chassis -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Ambient Soft Core Sheen -->
  <circle cx="256" cy="256" r="140" fill="#0284C7" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Outer Orbital 'O' (The Orion Loop) -->
  <path d="M 310,120
           A 168,168 0 1,0 310,392
           A 18,18 0 0,0 326,366
           A 132,132 0 1,1 326,146
           A 18,18 0 0,0 310,120 Z"
        fill="url(#crescentGrad)"/>

  <!-- Forward Action Play Prism (Integrated Core) -->
  <g>
    <!-- Top Main Facet -->
    <polygon points="176,146 392,256 252,256" fill="url(#topFacetGrad)"/>

    <!-- Bottom Main Facet -->
    <polygon points="176,366 392,256 252,256" fill="url(#bottomFacetGrad)"/>

    <!-- Left Core Base -->
    <polygon points="176,146 252,256 176,366" fill="#1E293B"/>

    <!-- Optical Specular Reflection (Sharp Bevel Sheen) -->
    <polygon points="176,146 392,256 252,256" fill="url(#spineGrad)" opacity="0.4"/>

    <!-- Precision Central Dividing Vector -->
    <line x1="176" y1="256" x2="392" y2="256" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Three Precision Belt Slits (Orion's Belt Signature) -->
    <g stroke="#00F5FF" stroke-width="3" stroke-linecap="round">
      <line x1="200" y1="210" x2="216" y2="242"/>
      <line x1="222" y1="210" x2="238" y2="242"/>
      <line x1="244" y1="210" x2="260" y2="242"/>
    </g>
  </g>
</svg>