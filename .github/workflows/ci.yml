name: OrionPlayer CI & Build Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build & Verify OrionPlayer (Linux)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          qt6-base-dev \
          libgl1-mesa-dev \
          libmpv-dev \
          mpv

    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=20

    - name: Compile OrionPlayer
      run: |
        cmake --build build -j$(nproc)

    - name: Test OrionPlayer Binary
      run: |
        ./build/orionplayer --version
        ./build/orionplayer --help

    - name: Package Release Tarball
      run: |
        mkdir -p dist/orionplayer-linux-x86_64
        cp build/orionplayer dist/orionplayer-linux-x86_64/
        cp install.sh dist/orionplayer-linux-x86_64/
        cp -r resources dist/orionplayer-linux-x86_64/
        cp README.md LICENSE dist/orionplayer-linux-x86_64/
        tar -czvf orionplayer-v1.0.0-linux-x86_64.tar.gz -C dist orionplayer-linux-x86_64

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: orionplayer-v1.0.0-linux-x86_64
        path: orionplayer-v1.0.0-linux-x86_64.tar.gz
