<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="50%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#04060A"/>
    </radialGradient>

    <!-- Outer Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Prism Gradient (Electric Cyan to Cosmic Purple) -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Top Optical Facet Highlight -->
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Bottom Facet Shadow -->
    <linearGradient id="facetShadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Starlight Constellation Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="116" ry="116" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="3.5"/>

  <!-- Celestial Coordinate Rings -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.65"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#2563EB" stroke-width="1.2" opacity="0.25"/>

  <!-- Constellation Starlight Vectors (Orion's Skeleton) -->
  <g stroke="#38BDF8" stroke-width="2.2" opacity="0.45" stroke-linecap="round" stroke-linejoin="round">
    <!-- Betelgeuse to Bellatrix -->
    <line x1="168" y1="140" x2="344" y2="152"/>
    <!-- Betelgeuse to Alnitak (Belt start) -->
    <line x1="168" y1="140" x2="216" y2="280"/>
    <!-- Bellatrix to Mintaka (Belt end) -->
    <line x1="344" y1="152" x2="296" y2="232"/>
    <!-- Belt line -->
    <line x1="216" y1="280" x2="256" y2="256"/>
    <line x1="256" y1="256" x2="296" y2="232"/>
    <!-- Saiph to Alnitak -->
    <line x1="188" y1="372" x2="216" y2="280"/>
    <!-- Rigel to Mintaka -->
    <line x1="334" y1="362" x2="296" y2="232"/>
    <!-- Saiph to Rigel bottom crossbar -->
    <line x1="188" y1="372" x2="334" y2="362"/>
  </g>

  <!-- Ambient Glow Behind Play Triangle -->
  <polygon points="214,152 366,256 214,360" fill="url(#prismGrad)" opacity="0.35" filter="url(#coreGlow)"/>

  <!-- Solid Play Prism -->
  <polygon points="214,152 366,256 214,360" fill="url(#prismGrad)"/>

  <!-- Top Geometric Facet (High-Tech Crystal Bevel) -->
  <polygon points="214,152 366,256 260,256" fill="url(#facetHighlight)"/>

  <!-- Bottom Geometric Facet -->
  <polygon points="214,360 366,256 260,256" fill="url(#facetShadow)"/>

  <!-- Constellation Anchor Stars (Glow and Core) -->
  <!-- Betelgeuse (Alpha Orionis - Supergiant) -->
  <circle cx="168" cy="140" r="9" fill="#F59E0B" opacity="0.4" filter="url(#starGlow)"/>
  <circle cx="168" cy="140" r="4.5" fill="#FDE68A"/>

  <!-- Bellatrix -->
  <circle cx="344" cy="152" r="7" fill="#00F5FF" opacity="0.4" filter="url(#starGlow)"/>
  <circle cx="344" cy="152" r="3.5" fill="#E0F2FE"/>

  <!-- Rigel (Beta Orionis - Brilliant Blue Supergiant) -->
  <circle cx="334" cy="362" r="9" fill="#38BDF8" opacity="0.4" filter="url(#starGlow)"/>
  <circle cx="334" cy="362" r="4.5" fill="#F0F9FF"/>

  <!-- Saiph -->
  <circle cx="188" cy="372" r="6" fill="#818CF8" opacity="0.4" filter="url(#starGlow)"/>
  <circle cx="188" cy="372" r="3" fill="#E0E7FF"/>

  <!-- The Three Belt Stars (Aligned through the Play Center) -->
  <g filter="url(#starGlow)">
    <circle cx="216" cy="280" r="4.5" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="6" fill="#FFFFFF"/>
    <circle cx="296" cy="232" r="4.5" fill="#FFFFFF"/>
  </g>
  <circle cx="216" cy="280" r="2.5" fill="#00F5FF"/>
  <circle cx="256" cy="256" r="3.5" fill="#00F5FF"/>
  <circle cx="296" cy="232" r="2.5" fill="#00F5FF"/>

  <!-- 4-Point Starlight Flare on the Central Star (Alnilam) -->
  <path d="M 256 242 Q 256 256 270 256 Q 256 256 256 270 Q 256 256 242 256 Q 256 256 256 242 Z" fill="#FFFFFF" opacity="0.9"/>
</svg>
